plugins {
    id 'com.android.application'
}

android {
    namespace 'com.guttertocrown.game'
    compileSdk 34

    defaultConfig {
        applicationId 'com.guttertocrown.game'
        minSdk 24
        targetSdk 34
        versionCode ((System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger() + 100)
        versionName "2.3.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
