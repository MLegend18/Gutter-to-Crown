name: Build APK

on:
  push:
    branches: [ main ]
    paths: [ 'index.html', 'app/**', '*.gradle', '.github/workflows/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Use the web game as the app's content
        run: cp index.html app/src/main/assets/index.html

      - name: Build the APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GutterToCrown.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GutterToCrown-apk
          path: GutterToCrown.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gutter to Crown build ${{ github.run_number }}
          files: GutterToCrown.apk
